server:
  port: ${SERVER_PORT:8081}

spring:
  temporal:
    namespace: default
    connection:
      target: localhost:7233
    workers:
      - task-queue: cinepass-reserva
    workers-auto-discovery:
      enabled: true
      workflow-packages:
        - br.com.cinepass.reserva.infrastructure.temporal.workflow
  application:
    name: reserva-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/cinepass_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      acks: all
      retries: 2147483647
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/reserva-service.log
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [%t] [correlationId=%X{correlationId:-}] [reservaId=%X{reservaId:-}] [eventId=%X{eventId:-}] %logger{30} : %m%n"
    file: "${logging.pattern.console}"