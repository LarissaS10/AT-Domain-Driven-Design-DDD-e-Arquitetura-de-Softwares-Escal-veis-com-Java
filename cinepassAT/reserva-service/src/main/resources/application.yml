server:
  port: ${SERVER_PORT:8081}

spring:
  temporal:
    namespace: default
    connection:
      target: localhost:7233
    workers:
      - task-queue: cinepass-reserva
    workers-auto-discovery:
      enabled: true
      workflow-packages:
        - br.com.cinepass.reserva.infrastructure.temporal.workflow
  application:
    name: reserva-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/cinepass_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
