server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ingresso-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/ingresso_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/ingresso-service.log
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name}] [%t] [correlationId=%X{correlationId:-}] [reservaId=%X{reservaId:-}] [eventId=%X{eventId:-}] %logger{30} : %m%n"
    file: "${logging.pattern.console}"