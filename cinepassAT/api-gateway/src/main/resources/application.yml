server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: reserva-service
              uri: lb://RESERVA-SERVICE
              predicates:
                - Path=/api/reservas/**,/api/filmes/**,/api/sessoes/**
            - id: pagamento-service
              uri: lb://PAGAMENTO-SERVICE
              predicates:
                - Path=/api/pagamentos/**
            - id: ingresso-service
              uri: lb://INGRESSO-SERVICE
              predicates:
                - Path=/api/ingressos/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  tracing:
    sampling:
      probability: 1.0